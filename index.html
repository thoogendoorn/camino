<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camino Spanish</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22%3E%3Crect width=%2240%22 height=%2240%22 rx=%228%22 fill=%22%231d47a5%22/%3E%3Cg stroke=%22%23f5b700%22 stroke-width=%223%22 stroke-linecap=%22round%22 fill=%22none%22%3E%3Cpath d=%22M20 35L4 14M20 35L9 9M20 35L15 6M20 35V5M20 35L25 6M20 35L31 9M20 35L36 14%22/%3E%3Cpath d=%22M4 14C8 6 14 4 20 4s12 2 16 10%22/%3E%3C/g%3E%3C/svg%3E">
<meta name="theme-color" content="#1d47a5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday learning: calm, encouraging, practical
   IDEA the Camino de Santiago waymarking: blue tiles with the yellow scallop shell and painted yellow arrows
   PICTURE the route itself: a trail of stages from Roncesvalles to Santiago, and today's ring
   COLOUR white ground, Camino tile blue dominant, stone support, arrow yellow accent
   TYPE Barlow Condensed (road-sign display) + Barlow (text)
   LAYOUT top nav; first screen = blue band with greeting and today's ring, then the plan; phone stacks */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0d1522);--ink:light-dark(#13203a,#e8edf6);--mut:light-dark(#5b6579,#9aa6bb);
--blue:light-dark(#1d47a5,#5d8cff);--blue2:light-dark(#163a89,#3d6fe6);--band:light-dark(#1d47a5,#132546);--bandink:#fff;
--stone:light-dark(#f1eee8,#162131);--line:light-dark(#dcd7cd,#273449);--yel:#f5b700;--yelink:#2a2000;
--good:light-dark(#1d47a5,#7fa6ff);--goodbg:light-dark(#e8eefc,#16264a);--bad:light-dark(#b42318,#ff8a7a);--badbg:light-dark(#fdecea,#3a1717);--close:light-dark(#8a5a00,#ffd36b);--closebg:light-dark(#fff5d6,#3a2f10)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16.5px/1.55 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Barlow Condensed",Barlow,sans-serif;line-height:1.05;letter-spacing:-.01em;text-wrap:balance;margin:0 0 .4em}
h1{font-size:clamp(34px,5vw,50px)}h2{font-size:clamp(24px,3vw,30px)}h3{font-size:21px;margin-top:1.2em}
a{color:var(--blue)}p{margin:.4em 0 .8em}
.band{padding:clamp(22px,3.4vw,48px) max(5vw,16px)}
.band>*{max-width:1180px;margin-left:auto;margin-right:auto}
.lead{font-size:18.5px}.muted{color:var(--mut)}.kicker{font-weight:600;color:var(--mut);margin:0 0 6px}.kicker a{color:inherit}
.note{background:var(--stone);border-radius:10px;padding:10px 14px;color:var(--ink)}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 max(5vw,16px);min-height:58px}
.brand{display:flex;align-items:center;gap:8px;font:700 24px "Barlow Condensed",sans-serif;color:var(--ink);text-decoration:none;flex:none}
.brand .logo{flex:none;width:32px;height:32px;border-radius:7px;background:var(--blue);display:grid;place-items:center}.brand .logo svg{width:24px;height:24px}
@media(max-width:520px){.brand .bt{display:none}}
#nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}#nav::-webkit-scrollbar{display:none}
#nav a{flex:none;padding:8px 11px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:600;font-size:15.5px;white-space:nowrap}
#nav a.on{background:var(--blue);color:#fff}#nav a:not(.on):hover{background:var(--stone)}
#syncstate{flex:none;font-size:13px;color:var(--mut);white-space:nowrap}#syncstate[data-s=on]::before{content:"● ";color:var(--blue)}#syncstate[data-s=error]::before{content:"● ";color:var(--bad)}
@media(max-width:760px){#syncstate{display:none}.top{gap:8px}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 18px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:600 16px Barlow,sans-serif;text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--blue)}.btn:focus-visible,.opt:focus-visible,.tile:focus-visible,.step:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:var(--blue2)}
.btn.ghost{background:transparent}.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.small{min-height:36px;padding:5px 12px;font-size:14.5px}.btn.icon{padding:0;width:44px;min-height:44px}.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;align-items:center;margin:14px 0}.row.wrap{flex-wrap:wrap}
input,select,textarea{font:16px Barlow,sans-serif;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{width:100%;resize:vertical}input[type=range]{accent-color:var(--blue);padding:0}
label{font-weight:600}.chk{display:flex;gap:8px;align-items:center;margin:8px 0;font-weight:500}.chk input{min-height:auto;width:20px;height:20px;accent-color:var(--blue)}
.panel{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:16px auto;background:var(--bg)}.panel h2{font-size:24px}
.panel.danger{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
/* hero */
.hero{background:var(--band);color:var(--bandink)}
.hero-in{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center}
.hero .kicker{color:#c9d6f5}.hero h1{font-size:clamp(40px,6vw,62px)}.hero .lead b{color:var(--yel)}
.mini-route{display:flex;gap:4px;margin-top:18px;flex-wrap:wrap;max-width:640px}.mini-route i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.22)}.mini-route i.d{background:#fff}.mini-route i.c{background:var(--yel);box-shadow:0 0 0 3px rgba(245,183,0,.35)}
.ring{width:clamp(150px,22vw,200px);height:auto}.ring-bg{fill:none;stroke:rgba(255,255,255,.18);stroke-width:12}.ring-fg{fill:none;stroke:var(--yel);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .8s}
.ring-num{fill:#fff;font:700 38px "Barlow Condensed",sans-serif;text-anchor:middle}.ring-sub{fill:#c9d6f5;font:500 12.5px Barlow,sans-serif;text-anchor:middle}
@media(max-width:600px){.hero-in{grid-template-columns:minmax(0,1fr) 108px;gap:12px;align-items:start}.ring{width:108px}.hero h1{font-size:38px}}
.welcome{background:var(--stone)}
/* plan */
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media(max-width:720px){.cards3{grid-template-columns:1fr}}
.plan-card{display:flex;flex-direction:column;gap:4px;padding:18px;border-radius:14px;border:1.5px solid var(--line);text-decoration:none;color:var(--ink);background:var(--bg);min-height:150px}
.plan-card:hover{border-color:var(--blue)}.plan-card.hot{border-color:var(--yel);background:color-mix(in srgb,var(--yel) 10%,var(--bg))}
.pc-k{font-weight:700;color:var(--mut);font-size:14.5px}.pc-big{font:700 46px/1 "Barlow Condensed",sans-serif}.pc-big small{font-size:22px;color:var(--mut)}.pc-big.small{font-size:26px;line-height:1.1}.pc-s{color:var(--mut);font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(10em,1fr));gap:12px;margin:16px auto}.kpis>div{background:var(--stone);border-radius:12px;padding:14px}
.kpis b{display:block;font:700 34px/1 "Barlow Condensed",sans-serif;color:var(--blue)}.kpis span{font-size:14.5px;color:var(--mut)}
.kpis.big b{font-size:40px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;max-width:560px;margin:0}
.wd{text-align:center;font-size:13.5px}.wd span{display:block;font-weight:600}.wd small{color:var(--mut)}
.wbar{height:90px;background:var(--stone);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}.wbar i{display:block;width:100%;background:var(--blue);border-radius:8px 8px 0 0}
/* camino */
.camino-head{padding-bottom:6px}
.camino{max-width:900px;margin:0 auto;padding:0 max(5vw,16px) 40px}
.etapa{margin:26px 0}.etapa-h{display:flex;gap:14px;align-items:center;background:var(--band);color:#fff;border-radius:14px;padding:14px 18px}
.etapa-h h2{margin:0;font-size:25px}.etapa-h p{margin:2px 0 0;color:#c9d6f5;font-size:15px}.etapa-h b{color:var(--yel)}
.lvl{flex:none;width:52px;height:52px;border-radius:10px;background:var(--yel);color:var(--yelink);display:grid;place-items:center;font:700 24px "Barlow Condensed",sans-serif}
.stops{list-style:none;margin:0;padding:18px 0 8px;position:relative;display:grid;gap:18px}
svg.trail{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}.trail-bg{fill:none;stroke:var(--line);stroke-width:5;stroke-dasharray:2 10;stroke-linecap:round}.trail-done{fill:none;stroke:var(--yel);stroke-width:6;stroke-linecap:round}
.stop{position:relative;display:flex}.stop.l{justify-content:flex-start;padding-left:8%}.stop.r{justify-content:flex-end;padding-right:8%}
.stop a{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:6px 18px 6px 6px;max-width:min(440px,88%);position:relative}
.stop.r a{flex-direction:row-reverse;padding:6px 6px 6px 18px;text-align:right}
.stop a:hover{border-color:var(--blue)}
.dot{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--stone);color:var(--mut);font:700 19px "Barlow Condensed",sans-serif}
.stop.done .dot{background:var(--blue);color:#fff}.stop.here .dot{background:var(--yel);color:var(--blue2);box-shadow:0 0 0 6px color-mix(in srgb,var(--yel) 30%,transparent)}.stop.here a{border-color:var(--yel);border-width:2px}
.stop.open .dot{background:var(--bg);border:2px solid var(--blue);color:var(--blue)}
.stop.locked a{color:var(--mut)}.dot svg{width:22px;height:auto}.stop.here .dot svg{width:30px}
.st-t{display:flex;flex-direction:column;font-weight:600;line-height:1.2}.st-t small{font-weight:500;color:var(--mut);font-size:13px}.st-p{font-size:13px;color:var(--blue);font-weight:600;white-space:nowrap}
.santiago{display:flex;gap:14px;align-items:center;background:var(--band);color:#fff;border-radius:14px;padding:18px;font-weight:600}.santiago svg{width:54px;flex:none}
@media(max-width:560px){.stop.l,.stop.r{padding:0;justify-content:flex-start}.stop.r a{flex-direction:row;text-align:left;padding:6px 18px 6px 6px}.stop a{max-width:100%}}
/* unit */
.unit-head{background:var(--stone)}.cando{margin:6px auto 0;padding-left:20px}.cando li{margin:2px 0}
.stamp{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--blue)}.stamp svg{width:34px;background:var(--blue);border-radius:8px;padding:4px}
.unit-grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;max-width:1180px;margin:0 auto;padding:24px max(5vw,16px)}
@media(max-width:760px){.unit-grid{grid-template-columns:1fr}}
.steps{display:flex;flex-direction:column;gap:6px;align-self:start;position:sticky;top:74px}

.step{display:flex;gap:10px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:8px 10px;cursor:pointer;font:500 15px Barlow,sans-serif;min-height:44px}
.step b{display:block;font-weight:700}.step small{color:var(--mut);font-size:13px;line-height:1.25;display:block}
.step .sn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--stone);display:grid;place-items:center;font-weight:700}
.step.ok .sn{background:var(--blue);color:#fff}.step.cur{border-color:var(--blue);box-shadow:inset 4px 0 0 var(--yel)}.step:disabled{opacity:.45;cursor:not-allowed}
.step-body{position:relative;min-height:300px}
@media(max-width:760px){.steps{position:static;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.step small{display:none}.step{flex-direction:column;gap:4px;text-align:center;padding:8px 4px}.step b{font-size:14.5px}}
table{border-collapse:collapse;width:100%}td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{font-weight:700}
table.vocab td.es{font-weight:600;color:var(--blue)}table.vocab td:last-child{width:52px;text-align:right}
.grammar table{margin:10px 0;font-size:15.5px}.grammar td,.grammar th{padding:6px 8px}.grammar b{color:var(--blue)}.grammar p,.grammar li{max-width:70ch}
.scroll{overflow-x:auto}table.conj td{white-space:nowrap}table.conj.full{font-size:14.5px}table.conj.full th{white-space:nowrap}
.examples{list-style:none;padding:0}.examples li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}.examples .en{grid-column:1;color:var(--mut);font-size:15px}
.es{color:var(--blue);font-weight:600}
.reading{font-size:19px;line-height:1.7;background:var(--stone);border-radius:14px;padding:18px 22px;max-width:70ch}.reading p{margin:.2em 0 .7em}
.reading .w{cursor:pointer;border-radius:4px}.reading .w:hover{background:color-mix(in srgb,var(--yel) 35%,transparent)}.reading .w.sel{background:var(--yel);color:var(--yelink)}
.gloss{position:absolute;z-index:5;background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:10px;max-width:300px;font-size:15px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.gloss a{color:var(--yel)}.gloss .btn{background:transparent;color:var(--bg);border:0;width:32px;min-height:32px}
.rq .q{margin:12px 0}.rq p{font-weight:600;margin-bottom:6px}
.prompt-w{font-weight:600;max-width:70ch}.ai-box{margin-top:12px;max-width:72ch}.ai-box:not(:empty){background:var(--stone);border-radius:12px;padding:14px 18px}
.res{list-style:none;padding:0;margin:8px auto}.res li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.res li a{flex:1;font-weight:600;min-width:12em}.res small{color:var(--mut)}
.rk{flex:none;font-size:12.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--stone);color:var(--mut);text-transform:capitalize;min-width:62px;text-align:center}.rk.listen{background:var(--blue);color:#fff}.rk.watch{background:var(--yel);color:var(--yelink)}.rk.read{background:var(--ink);color:var(--bg)}
.unit-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:0}.unit-nav>*{max-width:none;margin:0}
/* session overlay */
#session{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;overflow:auto}
#session[hidden]{display:none}body.in-session{overflow:hidden}
.sess-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:10px max(4vw,14px);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
.sess-title{font:700 20px "Barlow Condensed",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sess-count{font-weight:600;color:var(--mut);font-size:14.5px}
.bar{grid-column:1/-1;height:8px;background:var(--stone);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--yel);border-radius:99px;transition:width .3s}
.sess-body{flex:1;display:flex;justify-content:center;padding:clamp(16px,4vw,48px) 14px 40px}
.ex{width:100%;max-width:640px;display:flex;flex-direction:column;gap:14px}
.ex .sub{font-weight:700;color:var(--mut)}.ex .prompt{font:700 clamp(30px,5vw,44px)/1.1 "Barlow Condensed",sans-serif;text-wrap:balance}.ex .prompt.es{color:var(--blue)}
.ex .prompt.cloze{font:600 clamp(22px,3.6vw,30px)/1.35 Barlow,sans-serif;color:var(--ink)}.gap{display:inline-block;min-width:3.5em;border-bottom:3px solid var(--yel);color:var(--mut);text-align:center}.gap.gfill{color:var(--blue);border-color:var(--blue)}.gap.gbad{color:var(--bad);border-color:var(--bad)}
.ex .hint{color:var(--mut);font-size:16.5px}.ex .meaning{font-size:24px;font-weight:600}
.say-row{display:flex;gap:8px}.listen-big{display:flex;gap:12px;justify-content:center;padding:24px;background:var(--stone);border-radius:16px}.listen-big .btn{width:80px;min-height:80px;border-radius:50%;background:var(--blue);color:#fff;border:0}.listen-big .btn svg{width:34px;height:34px}.listen-big .btn.slow{background:var(--bg);color:var(--blue);border:2px solid var(--blue)}
.example{background:var(--stone);border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}.example .en{flex-basis:100%;color:var(--mut)}
.opts{display:grid;gap:10px}.opts.small{grid-template-columns:repeat(auto-fit,minmax(12em,1fr))}
.opt{display:flex;gap:12px;align-items:center;text-align:left;font:600 18px Barlow,sans-serif;padding:12px 14px;min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.opts.small .opt{font-size:16px;min-height:44px}.opt:hover:not(:disabled){border-color:var(--blue)}.opt .k{flex:none;width:26px;height:26px;border-radius:6px;background:var(--stone);display:grid;place-items:center;font-size:14px;color:var(--mut)}
.opt.right{border-color:var(--good);background:var(--goodbg)}.opt.wrong{border-color:var(--bad);background:var(--badbg)}.opt:disabled{cursor:default}
.answer input,.answer textarea{width:100%;font-size:20px;padding:12px 14px}
.accents{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.key{min-width:40px;min-height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--stone);color:var(--ink);font:600 17px Barlow,sans-serif;cursor:pointer}
.fb:empty{display:none}.fb{border-radius:12px;padding:12px 16px;font-size:16.5px}.fb.good{background:var(--goodbg);color:var(--good)}.fb.bad{background:var(--badbg)}.fb.bad b{color:var(--bad)}.fb.close{background:var(--closebg)}.fb.close b{color:var(--close)}
.fb .es{font-size:19px}.fb .you{color:var(--mut)}.fb .en{color:var(--mut)}.ai-note{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);color:var(--ink)}
.foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}.foot .btn.primary{min-width:140px}
.built{min-height:60px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0}.built .ph{color:var(--mut)}
.tiles{display:flex;flex-wrap:wrap;gap:8px}.tile{font:600 18px Barlow,sans-serif;padding:8px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;min-height:44px}
.tile.in{background:var(--goodbg);border-color:var(--blue)}.tile.used{visibility:hidden}
.mic-row{display:flex;flex-direction:column;gap:10px;align-items:flex-start}.btn.mic{background:var(--stone);border-color:var(--blue);min-height:56px}.btn.mic.on,#cmic.on{background:var(--bad);color:#fff;border-color:var(--bad)}.heard{font-size:19px;color:var(--blue);min-height:1.5em}
.done-card{align-items:flex-start}.big-num{font:700 88px/1 "Barlow Condensed",sans-serif;color:var(--blue)}
.mistakes{width:100%}.mis{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.mis .en{color:var(--mut)}
/* review forecast */
.fc{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:6px;max-width:760px;margin:0}.fcd{text-align:center;font-size:13px}.fcd span{display:block;font-weight:600}.fcd small{color:var(--mut)}
.fcb{height:100px;background:var(--stone);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}.fcb i{display:block;width:100%;background:var(--blue)}
/* verbs */
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{display:flex;gap:6px;align-items:center;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600;font-size:15px;cursor:pointer}.chip input{accent-color:var(--blue);width:18px;height:18px;min-height:auto}.chip small{color:var(--mut)}.chip.later{opacity:.7}
#vq{min-width:12em}
/* library */
.ladder{display:grid;gap:8px;max-width:760px;margin:12px 0}.rung{position:relative;display:grid;grid-template-columns:70px minmax(0,1fr);gap:12px;padding:10px 14px;border-radius:10px;background:var(--stone);overflow:hidden}.rung>*{position:relative;z-index:1}.rung b{font:700 22px "Barlow Condensed",sans-serif}
.rung i{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--yel) 30%,transparent);z-index:0}.rung.on{background:var(--band);color:#fff}.rung.on i{display:none}
.logf input#lt{flex:1;min-width:14em}.logf input#lm{width:90px}
table.log td.num{text-align:right;white-space:nowrap}
/* tutor */
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}.seg button{border:0;background:var(--bg);color:var(--ink);font:600 15px Barlow,sans-serif;padding:10px 14px;min-height:44px;cursor:pointer}.seg button.on{background:var(--blue);color:#fff}
.chat{display:flex;flex-direction:column;gap:10px;max-height:58vh;overflow:auto;padding:14px;background:var(--stone);border-radius:14px;margin:12px auto}
.msg{max-width:82%;padding:10px 14px;border-radius:14px;font-size:16.5px;position:relative}.msg.user{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px;padding-right:52px}.msg.assistant .say{position:absolute;right:4px;top:4px}.msg.empty{color:var(--mut);padding-right:14px}
.chat-in{display:flex;gap:8px;align-items:flex-end}.chat-in textarea{flex:1}
/* progress */
.levels{display:grid;gap:10px;max-width:760px;margin:0}.lvrow{display:grid;grid-template-columns:40px 100px minmax(0,1fr) 50px;gap:12px;align-items:center}.lvrow b{font:700 22px "Barlow Condensed",sans-serif}.lvbar{height:14px;background:var(--stone);border-radius:99px;overflow:hidden}.lvbar i{display:block;height:100%;background:var(--blue)}.lvrow small{text-align:right;color:var(--mut)}
.heat{display:grid;grid-auto-flow:column;grid-auto-columns:16px;gap:3px;width:max-content;margin:0}.heat i{width:16px;height:16px;border-radius:3px;background:var(--stone)}
.heat .h1{background:color-mix(in srgb,var(--blue) 30%,var(--stone))}.heat .h2{background:color-mix(in srgb,var(--blue) 55%,var(--stone))}.heat .h3{background:color-mix(in srgb,var(--blue) 80%,var(--stone))}.heat .h4{background:var(--blue)}.heat .fut{opacity:.25}
.bars30{position:relative;display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:3px;height:140px;align-items:end;max-width:900px;margin:0}.bars30>div:not(.goal-line){height:100%;display:flex;align-items:flex-end}.bars30>div i{display:block;width:100%;background:var(--blue);border-radius:3px 3px 0 0;min-height:2px}
.goal-line{position:absolute;left:0;right:0;border-top:2px dashed var(--yel);height:0}.goal-line span{position:absolute;right:0;top:-20px;font-size:13px;font-weight:600;color:var(--mut);background:var(--bg);padding:0 4px}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:0}
.sello{border:2px dashed var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;color:var(--mut)}.sello svg{width:44px;opacity:.25;filter:grayscale(1)}
.sello b{font:700 18px "Barlow Condensed",sans-serif;color:var(--ink)}.sello small{font-size:13px}.sello em{font-style:normal;font-size:12.5px;color:var(--blue);font-weight:600}
.sello.got{border:2px solid var(--blue);background:var(--goodbg);transform:rotate(-1.5deg)}.sello.got:nth-child(even){transform:rotate(1.2deg)}.sello.got svg{opacity:1;filter:none;background:var(--blue);border-radius:10px;padding:5px}
.about li{margin:6px 0;max-width:75ch}.about p{max-width:75ch}
/* v2 additions */
.cards4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media(max-width:1000px){.cards4{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.cards4{grid-template-columns:1fr}}
.pbar{height:10px;background:var(--stone);border-radius:99px;overflow:hidden;margin:8px 0}.pbar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.learnbox{background:var(--stone);border-radius:14px;padding:14px 18px;margin:10px 0 18px}.learnbox p{margin:4px 0}.learnbox .pbar{background:var(--bg)}
.vex{font-size:14.5px;margin-top:2px}.vex b{color:var(--blue)}table.vocab tr.k td.es::after{content:" ✓";color:var(--blue)}table.vocab tr.l td.es::after{content:" ·";color:var(--yel)}
.gym{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.gymc{min-height:120px;text-align:left;font:inherit;cursor:pointer}.gymc .pc-k{font-size:20px;color:var(--ink);font-family:"Barlow Condensed",sans-serif}.gymc:disabled{opacity:.5;cursor:default}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
.deck{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px}.deck.done{border-color:var(--blue);background:var(--goodbg)}
.deck-h{display:flex;justify-content:space-between;gap:10px}.deck-h b{display:block;font:700 21px "Barlow Condensed",sans-serif}.deck-h small{color:var(--mut)}.deck-n{font-weight:700;color:var(--blue);white-space:nowrap}
.deck .row{margin:8px 0 4px}.deck table{margin-top:8px;font-size:15px}
.decks-l{padding-top:10px;padding-bottom:10px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mcol{display:grid;gap:8px;align-content:start}.match .opt{font-size:16.5px;min-height:48px}.opt.pick{border-color:var(--yel);background:color-mix(in srgb,var(--yel) 18%,var(--bg))}.match .opt.es{color:var(--blue)}
.opts.two{grid-template-columns:1fr 1fr}
.rtabs{margin-bottom:12px}
.drill-list{padding-left:22px;max-width:75ch}.drill-list li{margin:6px 0}.drill-list .gap{min-width:0;padding:0 4px;color:var(--blue);border-color:var(--blue)}
pre.code{background:var(--stone);padding:12px;border-radius:10px;overflow:auto;font-size:13.5px;white-space:pre}
details summary{cursor:pointer;font-weight:600;margin:8px 0}
.lvbar.two{display:flex}.lvbar.two i.lt{background:color-mix(in srgb,var(--blue) 35%,var(--stone))}
.rtext{margin-bottom:4px}.reading.small{font-size:16px;padding:12px 16px;max-height:40vh;overflow:auto}
.ex u{text-decoration-color:var(--yel);text-decoration-thickness:3px;text-underline-offset:3px}
code{background:var(--stone);padding:1px 5px;border-radius:5px}
/* toast */
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,520px)}
.toast{background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.18);animation:tin .25s ease-out}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media(max-width:600px){table{font-size:14.5px}th,td{padding:6px 5px}.lead{font-size:17px}.sess-top{grid-template-columns:auto minmax(0,1fr) auto}.foot .btn{flex:1}.lvrow{grid-template-columns:36px 80px minmax(0,1fr) 40px}}
</style>
</head>
